[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-forecasting-engine"
version = "1.0.0"
description = "Point-in-time correct pipeline forecasting with calibrated deal probabilities, hierarchical rep roll-ups, and correlated aggregation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyarrow>=14.0",
    "duckdb>=0.10",
    "polars>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "hypothesis>=6.90"]

[project.scripts]
pfe = "pfe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
